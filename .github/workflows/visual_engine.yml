name: MAAT Visualisation Engine

on:
  workflow_run:
    workflows: ["MAAT Graph Engine"]
    types:
      - completed

  workflow_dispatch:

jobs:
  visualise:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: mkdir -p docs/_data

      - run: python -u src/visualisation_engine.py

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/_data docs/index.md
          git diff --cached --quiet || git commit -m "MAAT visual update"

          git pull --rebase origin main || echo "nothing to rebase"

          git push
