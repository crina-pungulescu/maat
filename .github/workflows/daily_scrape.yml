name: MAAT Daily Scrape

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  scrape:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug run timestamp
        run: |
          echo "MAAT RUN START"
          date

      - name: Run MAAT ingestion
        run: |
          python src/ingestion.py

      - name: Write heartbeat
        run: |
          echo "MAAT RUN COMPLETE $(date)" > data/last_run.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
        
      - name: Commit changes (if any)
        run: |
          git add data/
          git commit -m "MAAT automated daily ingestion" || echo "No changes"

      - name: Sync with remote safely
        run: |
          git pull --rebase origin main || echo "No remote changes to rebase"

      - name: Push updates
        run: |
          git push
